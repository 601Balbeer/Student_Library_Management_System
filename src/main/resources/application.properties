spring.application.name=student-library-management-system

server.port=7799

# DataSource properties
# Connect to the MySQL database
spring.datasource.url=jdbc:mysql://localhost:3307/student_library_
spring.datasource.username=root
spring.datasource.password=MySql@Bal1984
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate properties
# Update the database schema from the entity classes
spring.jpa.hibernate.ddl-auto=update
# Show SQL statements in the console
spring.jpa.show-sql=true
# Map Java types to MySQL database types
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
